name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Test
        run: pytest

      - name: Demo
        run: |
          set -eu
          EXAMPLES="$(trialstress examples)"
          trialstress compare "${EXAMPLES}/baseline.json" "${EXAMPLES}/slow-accrual.json" -o demo-out
          python - << 'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("demo-out/report.json").read_text(encoding="utf-8"))
          rows = {row["id"]: row for row in report["scenarios"]}
          baseline = rows["baseline"]
          slow = rows["slow-accrual"]
          assert baseline["enrolled_n"] == 100
          assert baseline["cutoff_eligible_n"] == 100
          assert baseline["mean_analyzable_n"] == 100
          assert slow["enrolled_n"] == 84
          assert slow["cutoff_eligible_n"] == 68
          assert slow["mean_analyzable_n"] == 68
          assert slow["unconditional_rejection_frequency"] < baseline["unconditional_rejection_frequency"] - 0.05
          for row in (baseline, slow):
              assert row["valid_analyses"] + row["invalid_analyses"] == row["replications"]
          print("demo ok")
          PY

      - name: Build package
        run: python -m build

      - name: Upload demo report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: demo-report
          path: |
            demo-out/report.json
            demo-out/report.html
            demo-out/report.txt
          if-no-files-found: error
